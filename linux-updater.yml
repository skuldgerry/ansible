---
# The lock is acquired in its own play so `serial` does not recreate it for
# every batch of hosts. A directory is used because mkdir is atomic.
- name: Acquire Linux updater lock
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  any_errors_fatal: true

  vars:
    updater_lock_path: /tmp/ansible-updater.lock
    updater_lock_stale_seconds: 43200  # 12 hours

  tasks:
    - name: Inspect updater lock
      ansible.builtin.stat:
        path: "{{ updater_lock_path }}"
      register: updater_lock

    - name: Remove a stale updater lock
      ansible.builtin.file:
        path: "{{ updater_lock_path }}"
        state: absent
      when:
        - updater_lock.stat.exists | default(false)
        - >-
          (ansible_facts["date_time"]["epoch"] | int) -
          (updater_lock.stat.mtime | int) > updater_lock_stale_seconds

    - name: Stop when another updater run owns the lock
      ansible.builtin.fail:
        msg: >-
          Another Linux updater run is active. Lock path:
          {{ updater_lock_path }}. It will be considered stale after
          {{ updater_lock_stale_seconds // 3600 }} hours.
      when:
        - updater_lock.stat.exists | default(false)
        - >-
          (ansible_facts["date_time"]["epoch"] | int) -
          (updater_lock.stat.mtime | int) <= updater_lock_stale_seconds

    - name: Atomically acquire updater lock
      ansible.builtin.command:
        argv:
          - mkdir
          - "{{ updater_lock_path }}"
      changed_when: true

    - name: Record updater lock owner
      ansible.builtin.copy:
        dest: "{{ updater_lock_path }}/owner"
        mode: "0644"
        content: |
          Started: {{ ansible_facts["date_time"]["iso8601"] }}
          Controller user: {{ lookup("env", "USER") | default("unknown", true) }}
          Semaphore task: {{ lookup("env", "SEMAPHORE_TASK_ID") | default("unknown", true) }}

- name: Update all Linux nodes
  hosts: all
  become: true
  gather_facts: true
  serial: 2
  any_errors_fatal: false
  # Continue with later batches even if every host in one batch fails.
  max_fail_percentage: 100

  vars:
    # This is the SSH connection/socket timeout, not the package task timeout.
    ansible_ssh_timeout: 30

    cache_timeout: 600              # 10 minutes
    repair_timeout: 900             # 15 minutes
    upgrade_timeout: 2700           # 45 minutes
    cleanup_timeout: 600            # 10 minutes
    timeout_kill_grace: 60          # SIGKILL 60 seconds after SIGTERM
    async_watchdog_margin: 120       # Independent Ansible-side margin
    async_poll_interval: 10

    apt_lock_timeout: 180
    apt_download_timeout: 30
    apt_download_retries: 3
    apt_environment:
      DEBIAN_FRONTEND: noninteractive
      DEBIAN_PRIORITY: critical
      APT_LISTCHANGES_FRONTEND: none
      NEEDRESTART_MODE: a
      UCF_FORCE_CONFFOLD: "1"
      LC_ALL: C

    rpm_package_manager: >-
      {{ ansible_facts["pkg_mgr"]
         if (ansible_facts["pkg_mgr"] | default(""))
            in ["dnf", "dnf5", "yum"]
         else "dnf" }}
    rpm_upgrade_action: >-
      {{ "update" if rpm_package_manager == "yum" else "upgrade" }}

  tasks:
    - name: Reject unsupported package-manager families
      ansible.builtin.assert:
        that:
          - ansible_facts["os_family"] in ["Debian", "RedHat"]
        fail_msg: >-
          Unsupported OS family {{ ansible_facts["os_family"] }} on
          {{ inventory_hostname }}; no package update was attempted.

    - name: Update APT package index
      ansible.builtin.command:
        argv:
          - timeout
          - --verbose
          - --signal=TERM
          - "--kill-after={{ timeout_kill_grace }}s"
          - "{{ cache_timeout }}s"
          - apt-get
          - -q
          - -o
          - "Acquire::Retries={{ apt_download_retries }}"
          - -o
          - "Acquire::http::Timeout={{ apt_download_timeout }}"
          - -o
          - "Acquire::https::Timeout={{ apt_download_timeout }}"
          - -o
          - "DPkg::Lock::Timeout={{ apt_lock_timeout }}"
          - update
      environment: "{{ apt_environment }}"
      async: "{{ cache_timeout + timeout_kill_grace + async_watchdog_margin }}"
      poll: "{{ async_poll_interval }}"
      register: apt_cache_result
      changed_when: false
      when: ansible_facts["os_family"] == "Debian"

    - name: Repair an interrupted Debian package transaction
      ansible.builtin.command:
        argv:
          - timeout
          - --verbose
          - --signal=TERM
          - "--kill-after={{ timeout_kill_grace }}s"
          - "{{ repair_timeout }}s"
          - apt-get
          - -q
          - -y
          - --fix-broken
          - -o
          - "Acquire::Retries={{ apt_download_retries }}"
          - -o
          - "Acquire::http::Timeout={{ apt_download_timeout }}"
          - -o
          - "Acquire::https::Timeout={{ apt_download_timeout }}"
          - -o
          - "DPkg::Lock::Timeout={{ apt_lock_timeout }}"
          - -o
          - "Dpkg::Options::=--force-confdef"
          - -o
          - "Dpkg::Options::=--force-confold"
          - install
      environment: "{{ apt_environment }}"
      async: "{{ repair_timeout + timeout_kill_grace + async_watchdog_margin }}"
      poll: "{{ async_poll_interval }}"
      register: apt_repair_result
      changed_when: >-
        '0 upgraded, 0 newly installed' not in
        (apt_repair_result.stdout | default(''))
      when: ansible_facts["os_family"] == "Debian"

    - name: Upgrade Debian packages
      ansible.builtin.command:
        argv:
          - timeout
          - --verbose
          - --signal=TERM
          - "--kill-after={{ timeout_kill_grace }}s"
          - "{{ upgrade_timeout }}s"
          - apt-get
          - -q
          - -y
          - -o
          - "Acquire::Retries={{ apt_download_retries }}"
          - -o
          - "Acquire::http::Timeout={{ apt_download_timeout }}"
          - -o
          - "Acquire::https::Timeout={{ apt_download_timeout }}"
          - -o
          - "DPkg::Lock::Timeout={{ apt_lock_timeout }}"
          - -o
          - "Dpkg::Options::=--force-confdef"
          - -o
          - "Dpkg::Options::=--force-confold"
          - upgrade
      environment: "{{ apt_environment }}"
      async: "{{ upgrade_timeout + timeout_kill_grace + async_watchdog_margin }}"
      poll: "{{ async_poll_interval }}"
      register: apt_upgrade_result
      changed_when: >-
        '0 upgraded, 0 newly installed' not in
        (apt_upgrade_result.stdout | default(''))
      when: ansible_facts["os_family"] == "Debian"

    - name: Remove unused Debian packages
      ansible.builtin.command:
        argv:
          - timeout
          - --verbose
          - --signal=TERM
          - "--kill-after={{ timeout_kill_grace }}s"
          - "{{ cleanup_timeout }}s"
          - apt-get
          - -q
          - -y
          - -o
          - "DPkg::Lock::Timeout={{ apt_lock_timeout }}"
          - -o
          - "Dpkg::Options::=--force-confdef"
          - -o
          - "Dpkg::Options::=--force-confold"
          - autoremove
      environment: "{{ apt_environment }}"
      async: "{{ cleanup_timeout + timeout_kill_grace + async_watchdog_margin }}"
      poll: "{{ async_poll_interval }}"
      register: apt_autoremove_result
      changed_when: >-
        '0 upgraded, 0 newly installed, 0 to remove' not in
        (apt_autoremove_result.stdout | default(''))
      when: ansible_facts["os_family"] == "Debian"

    - name: Clean obsolete Debian package files
      ansible.builtin.command:
        argv:
          - timeout
          - --verbose
          - --signal=TERM
          - "--kill-after={{ timeout_kill_grace }}s"
          - "{{ cleanup_timeout }}s"
          - apt-get
          - -q
          - -y
          - -o
          - "DPkg::Lock::Timeout={{ apt_lock_timeout }}"
          - autoclean
      environment: "{{ apt_environment }}"
      async: "{{ cleanup_timeout + timeout_kill_grace + async_watchdog_margin }}"
      poll: "{{ async_poll_interval }}"
      register: apt_autoclean_result
      changed_when: false
      when: ansible_facts["os_family"] == "Debian"

    - name: Refresh RPM package metadata
      ansible.builtin.command:
        argv:
          - timeout
          - --verbose
          - --signal=TERM
          - "--kill-after={{ timeout_kill_grace }}s"
          - "{{ cache_timeout }}s"
          - "{{ rpm_package_manager }}"
          - -y
          - makecache
      environment:
        LC_ALL: C
      async: "{{ cache_timeout + timeout_kill_grace + async_watchdog_margin }}"
      poll: "{{ async_poll_interval }}"
      register: rpm_cache_result
      changed_when: false
      when: ansible_facts["os_family"] == "RedHat"

    - name: Upgrade RPM packages
      ansible.builtin.command:
        argv:
          - timeout
          - --verbose
          - --signal=TERM
          - "--kill-after={{ timeout_kill_grace }}s"
          - "{{ upgrade_timeout }}s"
          - "{{ rpm_package_manager }}"
          - -y
          - "{{ rpm_upgrade_action }}"
      environment:
        LC_ALL: C
      async: "{{ upgrade_timeout + timeout_kill_grace + async_watchdog_margin }}"
      poll: "{{ async_poll_interval }}"
      register: rpm_upgrade_result
      changed_when: >-
        'Nothing to do' not in (rpm_upgrade_result.stdout | default('')) and
        'No packages marked for update' not in
        (rpm_upgrade_result.stdout | default(''))
      when: ansible_facts["os_family"] == "RedHat"

    - name: Clean RPM package metadata
      ansible.builtin.command:
        argv:
          - timeout
          - --verbose
          - --signal=TERM
          - "--kill-after={{ timeout_kill_grace }}s"
          - "{{ cleanup_timeout }}s"
          - "{{ rpm_package_manager }}"
          - -y
          - clean
          - all
      environment:
        LC_ALL: C
      async: "{{ cleanup_timeout + timeout_kill_grace + async_watchdog_margin }}"
      poll: "{{ async_poll_interval }}"
      register: rpm_clean_result
      changed_when: false
      when: ansible_facts["os_family"] == "RedHat"

    - name: Report successful package maintenance
      ansible.builtin.debug:
        msg: "Package maintenance completed successfully on {{ inventory_hostname }}."

# This play runs after all serial batches and also runs when individual hosts
# fail, so normal failures do not leave the controller locked until it is stale.
- name: Release Linux updater lock
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    updater_lock_path: /tmp/ansible-updater.lock

  tasks:
    - name: Release updater lock
      ansible.builtin.file:
        path: "{{ updater_lock_path }}"
        state: absent

    - name: Report updater completion
      ansible.builtin.debug:
        msg: "Linux updater run finished and the controller lock was released."
